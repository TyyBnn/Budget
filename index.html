  .flash{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--danger);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>

[{"label": "Plaisir — Suméria", "montant": 100}, {"label": "Alimentaire — Suméria", "montant": 200}, {"label": "Essence — BNP", "montant": 200}, {"label": "Fixes", "montant": 1027}], "EXTRA": [{"label": "Cadeaux parents", "montant": 236, "remb": 0}], "EPARGNE": [{"label": "💰 Assurance vie — Bourso", "montant": 300}, {"label": "💰 PEA — Trade Republic", "montant": 30}]}, {"REVENUS": [], "DEPENSES": [], "EXTRA": [], "EPARGNE": []}, {"REVENUS": [], "DEPENSES": [], "EXTRA": [], "EPARGNE": []}, {"REVENUS": [], "DEPENSES": [], "EXTRA": [], "EPARGNE": []}, {"REVENUS": [], "DEPENSES": [], "EXTRA": [], "EPARGNE": []}]}};
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const SECTIONS=[['REVENUS','REVENUS (MOULA)'],['DEPENSES','DÉPENSES'],['EXTRA','EXTRA'],['EPARGNE','ÉPARGNE']];
const SECCOL={REVENUS:'var(--pos)',DEPENSES:'var(--exp)',EXTRA:'var(--exp)',EPARGNE:'var(--save)'};
const PCOL={Tanguy:'var(--tanguy)',Dodo:'var(--dodo)'};
// ---- Configuration Supabase (clé publique) ----
const SUPABASE_URL='https://byndjuzokmdbowlwnghm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5bmRqdXpva21kYm93bHduZ2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Nzc4ODEsImV4cCI6MjEwMTI1Mzg4MX0.C2Jd8Qzjokc3rTnazEbPVNGZ1nxjRHw4NqdSPtxEOcU';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, loaded=false, saveT=null, authMode='signin';
function buildFields(){ if(DATA.fields) return; DATA.fields={}; for(const p of ['Tanguy','Dodo']){DATA.fields[p]={};for(const [k] of SECTIONS){const s=[];DATA.suivi[p].forEach(md=>md[k].forEach(l=>{if(!s.includes(l.label))s.push(l.label);}));DATA.fields[p][k]=s;}} }
let state={tab:'fixes',view:'mois',m:7};
function eur(n){return Math.round(+n||0).toLocaleString('fr-FR')+' €';}
function pct(n){return isFinite(n)&&n!==0?Math.round(n*100)+'%':'—';}
function esc(s){return(s||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));}
function hasRemb(k){return k==='EXTRA';}
function lineVal(l,k){let v=+l.montant||0;if(hasRemb(k))v-=(+l.remb||0);return v;}
function sumSec(a,k){return(a||[]).reduce((s,l)=>s+lineVal(l,k),0);}
function setTab(t){state.tab=t;render();}
function setView(v){state.view=v;render();}

function isBlank(p,m){const md=DATA.suivi[p][m];return SECTIONS.every(([k])=>md[k].length===0);}

function render(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===state.tab));
  const a=document.getElementById('app');
  if(state.tab==='fixes')a.innerHTML=viewFixes();

}

/* FIXES */
function viewFixes(){
  let sc=0,st=0,sd=0;
  const rows=DATA.fixes.map((f,i)=>{sc+=+f.commun||0;st+=+f.t||0;sd+=+f.d||0;
    return `<div class="fline">
      <input class="lab" value="${esc(f.label)}" onchange="DATA.fixes[${i}].label=this.value">
      <input class="num ccol" inputmode="numeric" value="${Math.round(f.commun)||''}" placeholder="0" onchange="DATA.fixes[${i}].commun=+this.value||0;render()">
      <input class="num tcol" inputmode="numeric" value="${Math.round(f.t)||''}" placeholder="0" onchange="DATA.fixes[${i}].t=+this.value||0;render()">
      <input class="num dcol" inputmode="numeric" value="${Math.round(f.d)||''}" placeholder="0" onchange="DATA.fixes[${i}].d=+this.value||0;render()">
      <button class="del" onclick="DATA.fixes.splice(${i},1);render()">✕</button></div>`;}).join('');
  const totT=sc/2+st, totD=sc/2+sd, virement=sc/2;
  return `<h1>Fixes communes</h1><p class="sub">« Commun » réparti 50/50 · total à reporter à la main dans le suivi</p>

    <div class="card virement"><div class="sec-top"><span class="sec-name">💸 VIREMENT À FAIRE</span><span class="sec-pct" style="min-width:auto">moitié du commun (${eur(sc)})</span></div><div class="v">${eur(virement)}</div></div>`;
}

/* PRO */
function viewPro(){
  const ca=DATA.pro.charges,totA=ca.reduce((s,c)=>s+(+c.annuel||0),0);
  const R=(a,i,f)=>`<div class="line"><input class="lab" value="${esc(a.label)}" onchange="${f}[${i}].label=this.value">
    <input class="num" inputmode="numeric" value="${Math.round(a.annuel!=null?a.annuel:a.montant)}" onchange="${f}[${i}].${a.annuel!=null?'annuel':'montant'}=+this.value||0;render()">
    <button class="del" onclick="${f}.splice(${i},1);render()">✕</button></div>`;
  const rows=ca.map((c,i)=>R(c,i,'DATA.pro.charges')).join('');
  const sim=DATA.pro.sim,totS=sim.reduce((s,c)=>s+(+c.montant||0),0);
  const simRows=sim.map((c,i)=>`<div class="line"><input class="lab" value="${esc(c.label)}" onchange="DATA.pro.sim[${i}].label=this.value">
    <input class="num" inputmode="numeric" value="${Math.round(c.montant)}" onchange="DATA.pro.sim[${i}].montant=+this.value||0;render()">
    <button class="del" onclick="DATA.pro.sim.splice(${i},1);render()">✕</button></div>`).join('');
  return `<h1>Pro — Dodo</h1><p class="sub">charges annuelles → mensuel, et simulation</p>
    <div class="card" style="${tint('var(--exp)')}"><div class="sec-top"><span class="sec-name" style="color:var(--exp)">CHARGES ANNUELLES</span></div>${rows}
      <button class="copyprev" style="background:none;color:var(--muted);border:1px dashed var(--ring);box-shadow:none;margin:8px 0 0" onclick="DATA.pro.charges.push({label:'Nouvelle charge',annuel:0});render()">+ Ajouter</button>
      <div class="totrow"><span>Total annuel</span><b style="color:var(--exp)">${eur(totA)}</b></div>
      <div class="totrow" style="border-top:1px solid var(--line)"><span>Total mensuel</span><b style="color:var(--exp)">${eur(totA/12)}</b></div></div>
    <div class="card" style="${tint('var(--save)')}"><div class="sec-top"><span class="sec-name" style="color:var(--save)">SIMULATION MENSUELLE</span></div>${simRows}
      <button class="copyprev" style="background:none;color:var(--muted);border:1px dashed var(--ring);box-shadow:none;margin:8px 0 0" onclick="DATA.pro.sim.push({label:'Nouvelle ligne',montant:0});render()">+ Ajouter</button>
      <div class="totrow"><span>Total</span><b style="color:var(--save)">${eur(totS)}</b></div></div>`;
}

/* SUIVI */
function viewSuivi(person){
  return `<h1><span class="pdot" style="background:${PCOL[person]}"></span>Suivi ${person}</h1>
    <div class="subnav">
      <div class="seg"><button class="${state.view==='mois'?'on':''}" onclick="setView('mois')">Mois</button><button class="${state.view==='annee'?'on':''}" onclick="setView('annee')">Année</button></div>
      ${state.view==='mois'?`<div class="mnav"><button onclick="shiftM(-1)">‹</button><span class="lbl">${MONTHS[state.m]}</span><button onclick="shiftM(1)">›</button></div>`:`<span class="sub" style="margin:0">2026</span>`}
    </div>`+(state.view==='mois'?suiviMois(person):suiviAnnee(person));
}
function suiviMois(person){
  const m=state.m, md=DATA.suivi[person][m];
  let copyBtn='';
  if(isBlank(person,m) && m>0 && !isBlank(person,m-1))
    copyBtn=`<button class="copyprev" onclick="copyPrev('${person}',${m})">⧉ Copier les champs de ${MONTHS[m-1]}</button>`;
  const rev=sumSec(md.REVENUS,'REVENUS'),dep=sumSec(md.DEPENSES,'DEPENSES'),ext=sumSec(md.EXTRA,'EXTRA'),epa=sumSec(md.EPARGNE,'EPARGNE');
  const reste=rev-dep-ext-epa;
  const cards=SECTIONS.map(([key,title])=>{
    const arr=md[key],tot=sumSec(arr,key),remb=hasRemb(key);
    const lines=arr.map((l,i)=>{
      const net=lineVal(l,key);
      const rembIn=remb?`<input class="num remb" inputmode="numeric" value="${l.remb?Math.round(l.remb):''}" placeholder="remb." onchange="DATA.suivi['${person}'][${m}]['${key}'][${i}].remb=+this.value||0;render()">`:'';
      const netl=(remb&&(+l.remb))?`<div class="netline">net <b>${eur(net)}</b></div>`:'';
      return `<div class="lwrap"><div class="line">
        <input class="lab" value="${esc(l.label)}" onchange="renameField('${person}','${key}',${i},${m},this.value)">
        <input class="num" inputmode="numeric" value="${Math.round(l.montant)}" onchange="DATA.suivi['${person}'][${m}]['${key}'][${i}].montant=+this.value||0;render()">
        ${rembIn}<button class="del" onclick="DATA.suivi['${person}'][${m}]['${key}'].splice(${i},1);render()">✕</button></div>${netl}</div>`;
    }).join('');
    const used=arr.map(l=>l.label);
    const avail=DATA.fields[person][key].filter(f=>!used.includes(f));
    const dlId='dl-'+person+'-'+m+'-'+key;
    const add=`<div class="addrow"><input class="addfield" list="${dlId}" placeholder="Champ à ajouter ou nouveau…">
      <datalist id="${dlId}">${avail.map(f=>`<option value="${esc(f)}"></option>`).join('')}</datalist>
      <button onclick="addLine(this,'${person}',${m},'${key}')">Ajouter</button></div>`;
    const pctStr=key==='REVENUS'?'':`<span class="sec-pct">${pct(tot/rev)}</span>`;
    return `<div class="card" style="${tint(SECCOL[key])}"><div class="sec-top"><span class="sec-name" style="color:${SECCOL[key]}">${title}</span>${pctStr}<span class="sec-tot" style="color:${SECCOL[key]}">${eur(tot)}</span></div>
      ${lines}${add}</div>`;
  }).join('');
  return copyBtn+cards+`<div class="card reste ${reste<0?'neg':''}"><div class="sec-top"><span class="sec-name">RESTE</span><span class="sec-pct">${pct(reste/rev)}</span></div><div class="v">${eur(reste)}</div></div>`;
}
function addLine(btn,person,m,key){
  const inp=btn.parentNode.querySelector('.addfield'); const name=(inp.value||'').trim(); if(!name)return;
  const arr=DATA.suivi[person][m][key], pool=DATA.fields[person][key];
  if(arr.some(l=>l.label===name)){ alert('« '+name+' » est déjà présent ce mois.'); return; }
  if(!pool.includes(name)) pool.push(name);
  const line={label:name,montant:0}; if(hasRemb(key))line.remb=0; arr.push(line); render();
}
function renameField(person,key,i,m,newName){
  const arr=DATA.suivi[person][m][key]; const old=arr[i].label; newName=(newName||'').trim();
  if(!newName||newName===old){render();return;}
  const pool=DATA.fields[person][key];
  if(pool.includes(newName)){ alert('Le champ « '+newName+' » existe déjà.'); render(); return; }
  const pi=pool.indexOf(old); if(pi>=0)pool[pi]=newName;
  DATA.suivi[person].forEach(md=>md[key].forEach(l=>{if(l.label===old)l.label=newName;}));
  render();
}
function copyPrev(person,m){
  const prev=DATA.suivi[person][m-1], cur=DATA.suivi[person][m];
  SECTIONS.forEach(([k])=>{cur[k]=prev[k].map(l=>{const o={label:l.label,montant:l.montant};if(hasRemb(k))o.remb=0;return o;});});
  render();
}
/* VUE ANNÉE ÉDITABLE */
function setYearCell(person,key,fi,m,val){
  val=+String(val).replace(/[^0-9]/g,'')||0;
  const label=DATA.fields[person][key][fi]; const arr=DATA.suivi[person][m][key];
  let line=arr.find(l=>l.label===label);
  if(!line){ if(!val){render();return;} line={label,montant:0}; if(hasRemb(key))line.remb=0; arr.push(line); }
  line.montant=val; render();
}
function suiviAnnee(person){
  const arr=DATA.suivi[person], MI=[...Array(12).keys()];
  let head='<th>Ligne</th>'+MONTHS.map(m=>`<th>${m.slice(0,4)}</th>`).join('')+'<th class="tot">TOTAL</th>';
  function detail(key,title){
    const labels=DATA.fields[person][key];
    let rows=labels.map((lab,fi)=>{let tot=0;const cells=MI.map(m=>{const v=arr[m][key].filter(l=>l.label===lab).reduce((s,l)=>s+lineVal(l,key),0);tot+=v;
      return `<td><input class="ycell num" inputmode="numeric" value="${v||''}" onchange="setYearCell('${person}','${key}',${fi},${m},this.value)"></td>`;}).join('');
      return `<tr class="detail"><td>${esc(lab)}</td>${cells}<td class="tot">${tot?eur(tot):'—'}</td></tr>`;}).join('');
    let st=0;const sc=MI.map(m=>{const v=sumSec(arr[m][key],key);st+=v;return `<td>${v?eur(v):'—'}</td>`;}).join('');
    rows+=`<tr class="subtot" style="color:${SECCOL[key]}"><td>${title}</td>${sc}<td class="tot">${eur(st)}</td></tr>`;
    return rows;
  }
  let body=detail('REVENUS','TOTAL REVENUS')+detail('DEPENSES','TOTAL DÉPENSES');
  let et=0;const ec=MI.map(m=>{const v=sumSec(arr[m].EXTRA,'EXTRA');et+=v;return `<td>${v?eur(v):'—'}</td>`;}).join('');
  body+=`<tr class="subtot" style="color:${SECCOL.EXTRA}"><td>EXTRA</td>${ec}<td class="tot">${eur(et)}</td></tr>`;
  body+=detail('EPARGNE','TOTAL ÉPARGNE');
  let rt=0;const rc=MI.map(m=>{const x=arr[m];const r=sumSec(x.REVENUS,'REVENUS')-sumSec(x.DEPENSES,'DEPENSES')-sumSec(x.EXTRA,'EXTRA')-sumSec(x.EPARGNE,'EPARGNE');rt+=r;const has=x.REVENUS.length||x.DEPENSES.length;return `<td style="color:${r<0?'var(--danger)':'var(--pos)'}">${has?eur(r):'—'}</td>`;}).join('');
  body+=`<tr class="subtot"><td>RESTE</td>${rc}<td class="tot" style="color:${rt<0?'var(--danger)':'var(--pos)'}">${eur(rt)}</td></tr>`;
  return `<div class="twrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="hint">Tu peux modifier les montants directement dans le tableau. EXTRA reste en total (ponctuel). Défile horizontalement sur mobile.</p>`;
}

// Champs € : chiffres uniquement (bloque les lettres à la saisie)
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('num')){const s=t.value.replace(/[^0-9]/g,'');if(s!==t.value)t.value=s;}});

/* ---- Sauvegarde / chargement Supabase ---- */
function scheduleSave(){ if(!loaded) return; clearTimeout(saveT); saveT=setTimeout(saveNow,700); }
async function saveNow(){ if(!session) return; try{ const {error}=await sb.from('budget_state').upsert({user_id:session.user.id,data:DATA,updated_at:new Date().toISOString()}); if(error) flash('Sauvegarde échouée'); }catch(e){ flash('Hors ligne ?'); } }
async function loadState(){
  const {data:row}=await sb.from('budget_state').select('data').eq('user_id',session.user.id).maybeSingle();
  if(row&&row.data&&row.data.suivi){ DATA=row.data; }
  buildFields(); loaded=true;
  if(!(row&&row.data&&row.data.suivi)) await saveNow();
}
/* ---- Authentification ---- */
function showAuth(){document.getElementById('authScreen').classList.remove('hide');}
function hideAuth(){document.getElementById('authScreen').classList.add('hide');}
function toggleAuthMode(){authMode=authMode==='signin'?'signup':'signin';
  document.getElementById('authTitle').textContent=authMode==='signin'?'Connexion':'Créer le compte';
  document.getElementById('authBtn').textContent=authMode==='signin'?'Se connecter':'Créer le compte';
  document.getElementById('authToggle').textContent=authMode==='signin'?'Créer un compte':"J'ai déjà un compte";
  document.getElementById('authMsg').textContent='';}
async function doAuth(){
  const email=document.getElementById('authEmail').value.trim(), pw=document.getElementById('authPass').value;
  const msg=document.getElementById('authMsg'); msg.className='auth-msg';
  if(!email||!pw){msg.textContent='E-mail et mot de passe requis.';return;} msg.textContent='…';
  const res=authMode==='signup'?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
  if(res.error){msg.textContent=res.error.message;return;}
  if(authMode==='signup'&&!res.data.session){msg.className='auth-msg ok';msg.textContent='Compte créé — vérifie tes e-mails pour confirmer.';}
}
async function signOut(){ await sb.auth.signOut(); }
function exportData(){ const b=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='budget-sauvegarde.json'; a.click(); }
let flashT=null; function flash(m){const f=document.getElementById('flash');if(!f)return;f.textContent=m;f.classList.add('on');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('on'),2500);}
async function afterLogin(){ hideAuth(); await loadState(); render(); }
async function init(){
  const {data:{session:s}}=await sb.auth.getSession(); session=s;
  if(s) afterLogin(); else showAuth();
  sb.auth.onAuthStateChange((_e,s2)=>{ session=s2; if(s2){afterLogin();} else {loaded=false; showAuth();} });
}
init();
</script>
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">💶</div>
    <h2 id="authTitle">Connexion</h2>
    <p class="auth-note">Compte partagé Tanguy &amp; Dodo</p>
    <input type="email" id="authEmail" placeholder="E-mail" autocomplete="email">
    <input type="password" id="authPass" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
    <div class="auth-msg" id="authMsg"></div>
    <button class="authbtn" id="authBtn" onclick="doAuth()">Se connecter</button>
    <button class="authbtn ghost" onclick="toggleAuthMode()"><span id="authToggle">Créer un compte</span></button>
  </div>
</div>
<div class="flash" id="flash"></div>
</body></html>
